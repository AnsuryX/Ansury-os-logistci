# ====================================================================
# ANSURY LOGISTICS OS — DOCKER COMPOSE CONFIGURATION
# Production stack ready for Coolify, Portainer, or standalone Docker
# ====================================================================

services:
  ansury-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ansury-logistics-os
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', (r) => {if (r.statusCode < 400) process.exit(0); else process.exit(1);})\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "coolify.managed=true"
      - "coolify.port=3000"
